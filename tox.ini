[tox]
requires =
    tox>=4.28
    tox-uv>=1
env_list =
    3.11-lower
    3.{11-14}-latest

[testenv]
package = wheel
uv_python_preference = only-managed
deps =
    pytest>=8
set_env =
    HF_HOME = {toxworkdir}/hf-cache
pass_env =
    DISPLAY
    XAUTHORITY
commands =
    python -m pytest --basetemp={toxworkdir}/pytest-output tests/test_cli.py tests/test_gui.py

[testenv:3.11-lower]
deps =
    pytest>=8
    packaging>=23.0
uv_resolution = lowest-direct
